server {
  minThreads: 1
  maxThreads: 1024
  # The maximum time to wait for Jetty, and all Managed instances, to cleanly shutdown before forcibly terminating them
  shutdownGracePeriod: 30 seconds
  adminMinThreads: 1
  adminMaxThreads: 110 # Should be > 1.5 times the number of cores: https://github.com/dropwizard/dropwizard/issues/523
  applicationConnectors: [{
    type: http,
    port: 21000,
    useForwardedHeaders: false
  }]
  # When you receive your TLS certs and get on-boarded with the Secret Service replace the above application
  # connector with this one, for more information about the Secret Service ../../readme.md
  # {
  #      type: dynamic-https-with-provider
  #      port: ${applicationPort}
  #      trustPath: /etc/oci-pki/ca-bundle.pem
  #      certPath: /secret/lvv-service-api/tls/cert/latest
  #      keyPath: /secret/lvv-service-api/key/latest
  #      intermediatePath: /secret/lvv-service-api/intermediate/latest # optional
  #      sslAutoReloadPeriod: 60 minutes
  #      wantClientAuth: false
  #      fipsApprovedOnlyMode: true
  # }
  adminConnectors: [{
    type: http,
    port: 21001,
    useForwardedHeaders: false
  }]
  requestLog {
    appenders: [{
      type: file
      currentLogFilename: ${logdir}/requests.log
      archive: true
      archivedLogFilenamePattern: ${logdir}/requests.%d"{yyyy-MM-dd_HH, UTC}".%i.log.gz
      archivedFileCount: 500
      timeZone: UTC
      maxFileSize: 2MB
      totalSizeCap: 10MB
      # Default pattern found at:
      # https://github.com/dropwizard/dropwizard/blob/master/dropwizard-request-logging/src/main/java/io/dropwizard/request/logging/layout/LogbackAccessRequestLayout.java
      logFormat: "%h %l %u [%t{dd/MMM/yyyy:HH:mm:ss Z,UTC}] \"%responseHeader{opc-request-id}\" \"%r\" %s %b \"%i{Referer}\" \"%i{User-Agent}\" %D"
    }]
  }
}

logdir = /logs/lvv-service-api

kievRateLimit: 150

# Configure the maxFileSize and totalSizeCap based on your traffic and disc size and operational requirements.
# Logging setting guideline for dropwizard service: https://confluence.oci.oraclecorp.com/x/nMeQFw
logging {
    level: INFO
    loggers {
        "com.oracle.pic.networking.lvv.service": DEBUG,

        # This logger name must match ${metricsConfiguration.componentName}.Metrics, for actually emitting a metrics.log file
        # Typesafe configurations do not allow variables on field names
        "lvvServiceApi.Metrics": {
          level: INFO
          appenders:  [{
            type: file
            currentLogFilename: ${logdir}/metrics.log
            archive: true
            archivedLogFilenamePattern: ${logdir}/metrics.%d"{yyyy-MM-dd_HH, UTC}".%i.log.gz
            archivedFileCount: 20
            timeZone: UTC
            logFormat: %message%n
            maxFileSize: 1MB
            totalSizeCap: 10MB
          }]
        }

        # See https://confluence.oci.oraclecorp.com/display/OBSRV/Observability+Standardization+Onboarding
        "service.log": {
          level: INFO
          additive: false
          appenders: [{
            type: file
            currentLogFilename: ${logdir}/service.log
            archive: true
            archivedLogFilenamePattern: ${logdir}/service.%d"{yyyy-MM-dd_HH, UTC}".log.gz
            archivedFileCount: 24
            timeZone: UTC
            logFormat: "%message%n"
          }]
        }
    }
    appenders: [{
      type: file
      currentLogFilename: ${logdir}/application.log
      archive: true
      archivedLogFilenamePattern: ${logdir}/application.%d"{yyyy-MM-dd_HH, UTC}".%i.log.gz
      #maintained through lumberjack
      archivedFileCount: 0
      timeZone: UTC
      maxFileSize: 1MB
      totalSizeCap: 100MB

      # request-id: https://confluence.oci.oraclecorp.com/display/DEX/Request+IDs
      logFormat: "%-5level %date{ISO8601, UTC} %mdc{opc-request-id} [%thread] %logger: %message%n"
    }]
}

metricsConfig {
    # All discovered resource methods defined in classes with prefixes that match the resourcePackagePrefix in
    # the metricsConfig have the 2XX, 4xx, 5xx, and time metrics automatically instrumented and emitted.
    # See https://confluence.oci.oraclecorp.com/x/ThJuBQ for details.
    resourcePackagePrefix: com.oracle.pic.networking.lvv.service.resources

    # The name of the project. It is recommended that this project name match the project name
    # set up Jira for alarming purposes.
    # Note that the name is case insensitive.
    projectName: network-automation

    # At the moment, the componentName  is only required for producing the metrics.log JSON files.
    #
    # Also, make sure that the logger name for metrics.log is set to "<componentName>.Metrics"
    #
    componentName: lvvServiceApi

    # The maximum number of metrics to buffer. Metrics that don’t fit in the buffer will be dropped
    maxMetricsToBuffer: 100000

    # The desired batch size
    desiredBatchSize: 1000

    # The maximum amount of time to buffer metrics before publishing them
    maxBufferTimeMillis: 3000

    # The jitter to use while publishing metrics
    maxJitterMillis: 100

    t2Config: {
      # https://grafana.oci.oraclecorp.com/dashboard/db/t2-g1gc?orgId=1&var-Region=T2-R1&var-ad=sea-ad-1&var-project={PROJECT}&var-fleet={FLEET}
      monitorGCLog: true
    }

    # Enables observability standardization, see https://confluence.oci.oraclecorp.com/display/OBSRV/Observability+Standardization+Onboarding
    enableServiceLog: true
}

# PIC Telemetry Metrics Reporter
# https://confluence.oci.oraclecorp.com/pages/viewpage.action?pageId=13929466
metrics: {
  reporters: [{
    type: scheduled-metric-reporter
    includes: ["org.eclipse.jetty.util.thread.QueuedThreadPool.dw\\..*"]
    useRegexFilters: true
  }]
}

# Sherlock Auditing (https://confluence.oraclecorp.com/confluence/display/SIC/Integrating+with+Sherlock)
auditConfig {
  eventSource: "LvvService"
  whitelistedAPIs: "/20180828/projects/*"
  whitelist {
    requestParameterRules: [ { resources: ".*", actions: ".*", values: ".*" } ]
    requestHeaderRules:    [ { resources: ".*", actions: ".*", values: ".*" } ]
    responseHeaderRules:   [ { resources: ".*", actions: ".*", values: ".*" } ]
  }
}

authConfig {
  identityWhitelistedName: lvv-service
  teamName: pegasus
  globalBusinessUnit: lvv-service
  applicationName: lvv-service-api
}

secretServiceConfig: {
  endpoint: "https://secret-service-ce.desktop.com/v1"
  tlsConfig: {
    caBundle: "/etc/oci-pki/ca-bundle.pem"
  }
  cacheConfig: {
    cacheExpiryInSeconds: 3600
    cacheRefreshIntervalInSeconds: 300
    cacheType: IN_MEMORY_CACHE
  }
  retryConfig: {
    maxRetries: 5
    minRetryDelayInMs: 200
    maxRetryDelayInMs: 2000
  }
  autoReloadCertsIntervalSeconds: 1800
}

assets: {
  overrides: {}
}

ncpServiceConfiguration: {
  endpoint: "https://ncp.%s.oci.oracleiaas.com"
  connectTimeoutInMs: 180000
  readTimeoutInMs: 180000
}

skConfig: {
  endpoint: "https://storekeeper.oci.oraclecorp.com"
}