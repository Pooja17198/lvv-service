server {
  minThreads: 1
  maxThreads: 1024
  # The maximum time to wait for Jetty, and all Managed instances, to cleanly shutdown before forcibly terminating them
  shutdownGracePeriod: 30 seconds
  adminMinThreads: 1
  adminMaxThreads: 110 # Should be > 1.5 times the number of cores: https://github.com/dropwizard/dropwizard/issues/523
  applicationConnectors: [{
    type: http,
    port: 8082
  }]
  adminConnectors: [{
    type: http,
    port: 39223
  }]
  requestLog {
    appenders: [{
      type: file
      currentLogFilename: ${logdir}/requests.log
      archive: true
      archivedLogFilenamePattern: ${logdir}/requests.%d"{yyyy-MM-dd_HH, UTC}".%i.log.gz
      archivedFileCount: 500
      timeZone: UTC
      maxFileSize: 2MB
      totalSizeCap: 10MB
      # Default pattern found at:
      # https://github.com/dropwizard/dropwizard/blob/master/dropwizard-request-logging/src/main/java/io/dropwizard/request/logging/layout/LogbackAccessRequestLayout.java
      logFormat: "%h %l %u [%t{dd/MMM/yyyy:HH:mm:ss Z,UTC}] \"%responseHeader{opc-request-id}\" \"%r\" %s %b \"%i{Referer}\" \"%i{User-Agent}\" %D"
    }]
  }
}

logdir = /logs/lvv-service-canary

logging {
    level: INFO
    loggers {
        "com.oracle.pic.networking.lvv.service.canary": DEBUG,
        "com.oracle.bmc": DEBUG,

        # This logger name must match ${metricsConfiguration.componentName}.Metrics, for actually emitting a metrics.log file
        # Typesafe configurations do not allow variables on field names
        "lvvServiceCanary.Metrics": {
          level: INFO
          appenders:  [{
            type: file
            currentLogFilename: ${logdir}/metrics.log
            archive: true
            archivedLogFilenamePattern: ${logdir}/metrics.%d"{yyyy-MM-dd_HH, UTC}".%i.log.gz
            archivedFileCount: 500
            timeZone: UTC
            logFormat: %message%n
            maxFileSize: 1MB
            totalSizeCap: 10MB
          }]
        }
    }
    appenders: [{
      type: file
      currentLogFilename: ${logdir}/application.log
      archive: true
      archivedLogFilenamePattern: ${logdir}/application.%d"{yyyy-MM-dd_HH, UTC}".%i.log.gz
      archivedFileCount: 500
      timeZone: UTC
      maxFileSize: 1MB
      totalSizeCap: 100MB

      # request-id: https://confluence.oci.oraclecorp.com/display/DEX/Request+IDs
      logFormat: "%-5level %date{ISO8601, UTC} %mdc{opc-request-id} [%thread] %logger: %message%n"
    }]
}

metricsConfig {
    resourcePackagePrefix: com.oracle.pic.networking.lvv.service.canary.resources

    # The name of the project. It is recommended that this project name match the project name
    # set up win Jira for alarming purposes. Note that the name is case insensitive.
    projectName: pegasus

    # At the moment, the componentName  is only required for producing the metrics.log JSON files.
    #
    # Also, make sure that the logger name for metrics.log is set to "<componentName>.Metrics"
    #
    componentName: lvvServiceCanary

    # The maximum number of metrics to buffer. Metrics that don’t fit in the buffer will be dropped
    maxMetricsToBuffer: 100000

    # The desired batch size
    desiredBatchSize: 1000

    # The maximum amount of time to buffer metrics before publishing them
    maxBufferTimeMillis: 3000

    # The jitter to use while publishing metrics
    maxJitterMillis: 100

    t2Config: {
      # The fleet name to be published for every metric
      fleet: lvv-service-canary

      # https://grafana.oci.oraclecorp.com/dashboard/db/t2-g1gc?orgId=1&var-Region=T2-R1&var-ad=sea-ad-1&var-project={PROJECT}&var-fleet={FLEET}
      monitorGCLog: true
    }
}

secretServiceConfig: {
  endpoint: "https://secret-service-ce.desktop.com/v1"
  tlsConfig: {
    caBundle: "/etc/oci-pki/ca-bundle.pem"
  }
  cacheConfig: {
    cacheExpiryInSeconds: 3600
    cacheRefreshIntervalInSeconds: 300
    cacheType: IN_MEMORY_CACHE
  }
  retryConfig: {
    maxRetries: 5
    minRetryDelayInMs: 200
    maxRetryDelayInMs: 2000
  }
  autoReloadCertsIntervalSeconds: 1800
}

# PIC Telemetry JVM Metrics Reporter
# https://confluence.oci.oraclecorp.com/pages/viewpage.action?pageId=13929466
metrics: {
  reporters: [{
    type: scheduled-metric-reporter
    includes: ["org.eclipse.jetty.util.thread.QueuedThreadPool.dw\\..*"]
    useRegexFilters: true
  }]
}

