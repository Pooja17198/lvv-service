# This is the LvvService API spec in YAML based on API Consistency Guidelines.
# Clients and documentation will be auto-generated from this file.
#
# API Consistency Guidelines: https://confluence.oci.oraclecorp.com/x/n5Sf
# Review the API checklist: https://confluence.oci.oraclecorp.com/x/dAZY
swagger: '2.0'
x-oracle-package: com.oracle.pic.networking.lvv.service
info:
  title: LvvService API
  description: A description of the LvvService API.
  contact:
    name: "Network Control Plane"
    email: opc_nw_automation_dev_us_grp@oracle.com
    url: https://confluence.oci.oraclecorp.com/display/NETAUTO/Low+Voltage+Vendor+Portal+Security+Design+and+Considerations
  version: "1.0.0"

# array of all schemes that your API supports
schemes:
  - http
  - https
# basePath will be prefixed to all paths. Make sure to update the path in resource files and audit config in api base.conf after modifying the basePath.
basePath: /lvv
produces:
  - application/json

host: localhost:25000
# Enable SDK Retries by default
# Details: https://confluence.oci.oraclecorp.com/display/DEX/API+Consistency+Guidelines#APIConsistencyGuidelines-DefaultRetriesintheSDKs
x-obmcs-client-retries-enabled: true

x-obmcs-endpoint-template: 'https://lvv-service.{region}.oci.{secondLevelDomain}'


# =============================================================================
# Paths
# =============================================================================
paths:
  /projects/{project-id}:
    get:
      tags: ['projects']
      operationId: GetProject
      summary: Get Project
      description: Gets a project by identifier
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        200:
          description: Retrieves the project with the given id
          schema:
            $ref: '#/definitions/Project'
        404:
          description: The project with the given projectId could not be found
          schema:
            $ref: '#/definitions/Error'
        default:
          $ref: '#/responses/Error'

    put:
      tags: ['projects']
      operationId: CreateProject
      summary: Creates a new project
      description: Create a new project with the provided identifier
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/PutProjectRequestBodyParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        200:
          description: Newly created project
          schema:
            $ref: '#/definitions/Project'
        400:
          description: The project Id is not valid
          schema:
            $ref: '#/definitions/Error'
        default:
          $ref: '#/responses/Error'

    delete:
      tags: ['projects']
      operationId: DeleteProject
      description: Deletes an existing project
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        204:
          description: The project was successfully deleted.
        default:
          $ref: '#/responses/Error'

  /cablingTasks:
    get:
      tags: [ 'cablingTasks' ]
      operationId: GetCablingTasks
      summary: Get cabling tasks
      description: Get cabling tasks based on query parameters
      parameters:
        - $ref: '#/parameters/BuildingParam'
        - $ref: '#/parameters/BlockParam'
        - $ref: '#/parameters/RackSerialNumberParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        200:
          description: Retrieves the cabling tasks with the given query parameters
          schema:
            $ref: '#/definitions/CablingTaskCollection'
        default:
          $ref: '#/responses/Error'

  /cablingTasks/{cablingTaskId}/actions/resolveValidationFailureTask:
    post:
      tags: [ 'cablingTasks' ]
      operationId: ResolveValidationFailureTask
      summary: Resolve a cable validation failure task
      description: Resolve a cable validation failure task
      parameters:
        - $ref: '#/parameters/CablingTaskIdentifierPathParam'
      responses:
        200:
          description: The cabling task has been resolved.
        default:
          $ref: '#/responses/Error'

#==========[ Definitions ]================================================================================================

definitions:
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      fields:
        type: string
  Project:
    description: A project object represents the information of a specific project.
    type: object
    required:
      - vendorName
      - type
    properties:
      vendorName:
        type: string
        description: Name of the vendor the project is assigned to
        minLength: 1
        maxLength: 100
      type:
        type: string
        description: Project type
        minLength: 1
        maxLength: 50
  PutProjectRequest:
    description: A request to create a new project
    properties:
      project:
        $ref: '#/definitions/Project'
  CablingTaskCollection:
    description: An array of cabling tasks.
    type: object
    properties:
      initialCablingTasks:
        description: An array of initial cabling tasks.
        type: array
        items:
          $ref: '#/definitions/InitialCablingTaskDetails'
      validationFailureTasks:
        description: An array of cable validation failure tasks.
        type: array
        items:
          $ref: '#/definitions/ValidationFailureTaskDetails'
  InitialCablingTaskDetails:
    description: Details for each initial cabling task.
    type: object
    properties:
      ticketId:
        type: string
        description: Jira-SD ticket ID corresponding to the task.
      building:
        type: string
        description: Building ID.
      block:
        type: string
        description: Block ID.
      rackSerialNumber:
        type: string
        description: Rack serial number.
  ValidationFailureTaskDetails:
    description: Details for each cable validation failure task.
    type: object
    properties:
      ticketId:
        type: string
        description: Jira-SD ticket ID corresponding to the task.
      building:
        type: string
        description: Building ID.
      block:
        type: string
        description: Block ID.
      rackSerialNumber:
        type: string
        description: Rack serial number.
      failureReason:
        type: string
        description: JSON of why cable validation fails.


#==========[ Parameters ]================================================================================================
parameters:
  PutProjectRequestBodyParam:
    name: value
    in: body
    required: true
    schema:
      $ref: '#/definitions/PutProjectRequest'
    description: Information required for creating a project
  ProjectIdentifierPathParam:
    name: projectId
    type: string
    in: path
    description: Unique Id for a project
    minLength: 1
    maxLength: 50
  BuildingParam:
    name: building
    type: string
    in: query
    required: true
    description: Unique Id for a building
    minLength: 1
    maxLength: 10
  BlockParam:
    name: block
    type: string
    in: query
    required: true
    description: Unique Id for a block
    minLength: 1
    maxLength: 10
  RackSerialNumberParam:
    name: rackSerialNumber
    type: string
    in: query
    description: Serial number for a rack
    minLength: 1
    maxLength: 50
  CablingTaskIdentifierPathParam:
    name: cablingTaskId
    type: string
    in: path
    description: A unique cabling task identifier
    required: true
  OpcRequestId:
    name: opc-request-id
    in: header
    type: string
    description: The client request ID for tracing


#==========[ Responses ]================================================================================================
responses:
  Error:
    description: An unexpected error has occurred
    schema:
      $ref: '#/definitions/Error'
