# Paths
# =============================================================================
paths:
  /projects:
    get:
      tags: ['project']
      operationId: ListProjects
      summary: Gets a list of all Projects in a compartment
      description: |
        Returns a list of Projects.
      parameters:
        - $ref: '#/parameters/CompartmentIdQueryParam'
        - $ref: '#/parameters/DisplayNameQueryParam'
        - $ref: '#/parameters/PaginationLimitQueryParam'
        - $ref: '#/parameters/PaginationTokenQueryParam'
        - $ref: '#/parameters/LifecycleStateQueryParam'
        - $ref: '#/parameters/SortOrderQueryParam'
        - $ref: '#/parameters/SortByQueryParam'
        - $ref: '#/parameters/RequestIdHeader'
        # It is recommended to use the UDX ticket number as group name to enable/disable the feature.
        # The UDX ticket number used here is only an example.
          @ifdef UDX-123
          # Add the new feature that you want to enable/disable here. Similar login applies to methods as well.
          # - $ref: '#/parameters/NewParameterExample'
          @endif # UDX-123
      x-related-resource: '#/definitions/ProjectCollection'
      responses:
        200:
          description: A page of ProjectSummary objects.
          schema:
            $ref: '#/definitions/ProjectCollection'
          headers:
            opc-request-id: *ref-opc-request-id
            opc-next-page: *ref-opc-next-page
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'

    post:
      tags: ['project']
      operationId: CreateProject
      summary: Creates a new Project
      description: |
        Creates a new Project.
      parameters:
        - name: CreateProjectDetails
          description: Details for the new Project.
          required: true
          in: body
          schema:
            $ref: '#/definitions/CreateProjectDetails'
        - $ref: '#/parameters/RetryTokenHeader'
        - $ref: '#/parameters/RequestIdHeader'
      x-related-resource: '#/definitions/Project'
      responses:
        200:
          description: The Project was successfully created.
          headers:
            etag: *ref-etag
            opc-request-id:  *ref-opc-request-id
          schema:
            $ref: '#/definitions/Project'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'

  /projects/{projectId}:
    get:
      tags: ['project']
      operationId: GetProject
      summary: Get Project
      description: Gets a Project by identifier
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/RequestIdHeader'
      responses:
        200:
          description: Retrieves the Project with the given id
          schema:
            $ref: '#/definitions/Project'
          headers:
            etag: *ref-etag
            opc-request-id: *ref-opc-request-id
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'

    put:
      tags: ['project']
      operationId: UpdateProject
      summary: Update the Project identified by the id
      description: Updates the Project
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - name: UpdateProjectDetails
          description: The information to be updated.
          required: true
          in: body
          schema:
            $ref: '#/definitions/UpdateProjectDetails'
        - $ref: '#/parameters/IfMatchHeader'
        - $ref: '#/parameters/RequestIdHeader'
      x-related-resource: '#/definitions/Project'
      responses:
        200:
          description: The Project was successfully updated.
          headers:
            etag: *ref-etag
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/Project'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        404:
          $ref: '#/responses/404'
        412:
          $ref: '#/responses/412'
        429:
          $ref: '#/responses/429'
        500:
          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'

    delete:
      tags: ['project']
      operationId: DeleteProject
      summary: Delete a provisioned Project
      description: Deletes a Project resource by identifier
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/IfMatchHeader'
        - $ref: '#/parameters/RequestIdHeader'
      x-related-resource: '#/definitions/Project'
      responses:
        204:
          description: The Project was successfully deleted.
          headers:
            opc-request-id: *ref-opc-request-id
