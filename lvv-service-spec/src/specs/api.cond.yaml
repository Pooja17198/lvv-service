swagger: '2.0'
x-oracle-package: com.oracle.pic.networking.lvv.service
x-obmcs-splat:
  version: '1.0'
  services:
    lvv-api-beta:
      openIdConnectConfig:
        clientId: "lvvportal-dev"
        redirectUriExpression: "'https://' + request.hostName + '/callback'"
        frontChannelLogoutUrlExpression: "'https://' + request.hostName + '/logout'"
        postLogoutRedirectUrlExpression: "'https://' + request.hostName + '/postlogout.html'"
        defaultToSsoLogin: false
      authenticationMode: ['oci-signature', 'openid-connect']
      skipOriginCheck: true
        # This enables Audit automation through SPLAT. SPLAT automatically emits following:
        #  a) an event corresponding to sync api call.
        #  b) a begin event for async api calls. Service team has to emit end events corresponding to success/failure of async call.
      #  Reference-app emits end events in respective workflow. See AuditEventEmitter for details.
      #
      # Omitting audit implies you don't want Splat to audit operations for this service (ocdn-control-plane-api)
      #
      # More details about audit automation can be found at https://confluence.oci.oraclecorp.com/x/vg5jCg and https://confluence.oci.oraclecorp.com/x/UQ9jCg
      audit:
        # defaultMode can be either none/verification/automated.
        # verification: can be used for verification. Random percentage(< 1%) of requests will be audited by Splat
        # automated: means Splat will perform audit and add "oci-splat-audited" header to requests proxied downstream
        defaultMode: automated
        eventSource: lvv-api-beta
        requestParameterRules: [ { resources: ".*", actions: ".*", values: ".*" } ]
        requestHeaderRules:    [ { resources: ".*", actions: ".*", values: ".*" } ]
        responseHeaderRules:   [ { resources: ".*", actions: ".*", values: ".*" } ]
      # allows unreviewed entity types in splat
      # Entity types are already onboarded to identity.
      # But splat-swagger-maven-plugin version which includes them is not yet released.
      # This flag need to be removed when splat-swagger-maven-plugin update is available.
      allowingUnreviewedEntityType: true

info:
  title: LvvService API
  description: A description of the LvvService API.
  contact:
    name: "Network Automation"
    email: opc_nw_automation_dev_us_grp@oracle.com
    url: https://confluence.oci.oraclecorp.com/display/NETAUTO/Low+Voltage+Vendor+Portal+Security+Design+and+Considerations
  version: "1.0.0"

# array of all schemes that your API supports
schemes:
  - http
  - https
# basePath will be prefixed to all paths. Make sure to update the path in resource files and audit config in api base.conf after modifying the basePath.
basePath: /lvv
