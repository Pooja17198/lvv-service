          $ref: '#/responses/500'
        default:
          $ref: '#/responses/default'

#==========[ Definitions ]================================================================================================

definitions:

  LifecycleState:
    type: string
    description: Possible lifecycle states.
    enum: &LIFECYCLESTATE
      - CREATING
      - UPDATING
      - ACTIVE
      - DELETING
      - DELETED
      - FAILED

  Project:
    description: Description of Project.
    type: object
    required:
      - id
      - compartmentId
      - lifecycleState
    properties:
      id:
        description: The Unique Oracle ID (OCID) that is immutable on creation.
        type: string
      compartmentId:
        description: The OCID of the compartment containing the Project.
        type: string
      displayName:
        description: A user-friendly name. Does not have to be unique, and it's changeable. Avoid entering confidential information.
        type: string
      timeCreated:
        description: The time the the Project was created. An RFC3339 formatted datetime string
        type: string
        format: date-time
      lifecycleState:
        description: The current state of the Project.
        type: string
        x-obmcs-top-level-enum: '#/definitions/LifecycleState'
        enum: *LIFECYCLESTATE
      freeformTags: *ref-freeformTags
      definedTags: *ref-definedTags
      systemTags: *ref-systemTags

  ProjectSummary:
    description: Summary of the Project.
    type: object
    required:
      - id
      - compartmentId
      - lifecycleState
    properties:
      id:
        description: Unique identifier that is immutable on creation
        type: string
      compartmentId:
        description: Compartment Identifier
        type: string
      displayName:
        description: Project Identifier, can be renamed
        type: string
      timeCreated:
        description: The time the the Project was created. An RFC3339 formatted datetime string
        type: string
        format: date-time
      lifecycleState:
        description: The current state of the Project.
        type: string
        x-obmcs-top-level-enum: '#/definitions/LifecycleState'
        enum: *LIFECYCLESTATE
      freeformTags: *ref-freeformTags
      definedTags: *ref-definedTags
      systemTags: *ref-systemTags

  ProjectCollection:
    type: object
    description: Results of a project search. Contains both ProjectSummary items and other data.
    required:
      - items
    properties:
      items:
        description: List of projects.
        type: array
        items:
          $ref: "#/definitions/ProjectSummary"

  CreateProjectDetails:
    description: The information about new Project.
    type: object
    required:
      - displayName
      - compartmentId
    properties:
      displayName:
        description: Project Identifier
        type: string
        minLength: 1
        maxLength: 255
      compartmentId:
        description: Compartment Identifier
        type: string
        minLength: 1
        maxLength: 255
      freeformTags: *ref-freeformTags
      definedTags: *ref-definedTags

  UpdateProjectDetails:
    description: The information to be updated.
    type: object
    required:
      - displayName
    properties:
      displayName:
        description: Project Identifier
        type: string
        minLength: 1
        maxLength: 255
      freeformTags: *ref-freeformTags
      definedTags: *ref-definedTags

  SortOrders:
    type: string
    description: Sort orders.
    enum: &SORTORDERS
      - ASC
      - DESC

  Error:
    description: Error Information.
    required:
      - code
      - message
    properties:
      code:
        description: A short error code that defines the error, meant for programmatic parsing.
        type: string
      message:
        description: A human-readable error string.
        type: string

#==========[ Parameters ]================================================================================================
parameters:

  ProjectIdentifierPathParam:
    name: projectId
    type: string
    in: path
    required: true
    description: Unique Project identifier

  LifecycleStateQueryParam:
    name: lifecycleState
    in: query
    required: false
    type: string
    x-obmcs-top-level-enum: '#/definitions/LifecycleState'
    enum: *LIFECYCLESTATE
    x-default-description: 'null'
    description: A filter to return only resources their lifecycleState matches the given lifecycleState.

  PaginationLimitQueryParam:
    name: limit
    in: query
    type: integer
    minimum: 1
    maximum: 100
    default: 10
    description: The maximum number of items to return.

  PaginationTokenQueryParam:
    name: page
    in: query
    type: string
    minLength: 1
    description: A token representing the position at which to start retrieving results. This must come from the `opc-next-page` header field of a previous response.

  SortOrderQueryParam:
    name: sortOrder
    in: query
    type: string
    x-obmcs-top-level-enum: '#/definitions/SortOrders'
    enum: *SORTORDERS
    x-default-description: |
      The default value depends upon `sortBy`, and
      in general is 'DESC' when sorting by time and 'ASC' otherwise.
    description: The sort order to use, either 'ASC' or 'DESC'.

  SortByQueryParam:
    name: sortBy
    in: query
    type: string
    enum:
      - timeCreated
      - displayName
    default: 'timeCreated'
    description: |
      The field to sort by. Only one sort order may be provided. Default order for timeCreated is descending. Default order for displayName is ascending.

  CompartmentIdQueryParam:
    name: compartmentId
    in: query
    required: true
    type: string
    description: The ID of the compartment in which to list resources.

  DisplayNameQueryParam:
    in: query
    maxLength: 255
    minLength: 1
    name: displayName
    type: string
    x-default-description: 'null'
    description: A filter to return only resources that match the entire display name given.

  RequestIdHeader:
    name: opc-request-id
    in: header
    type: string
    description: |
      The client request ID for tracing. The only valid characters for request IDs are letters, numbers,
      underscore, and dash.

  RetryTokenHeader:
    description: |
      A token that uniquely identifies a request so it can be retried in case of a timeout or
      server error without risk of executing that same action again. Retry tokens expire after 24
      hours, but can be invalidated before then due to conflicting operations. For example, if a resource
      has been deleted and purged from the system, then a retry of the original creation request
      might be rejected.
    in: header
    maxLength: 64
    minLength: 1
    name: opc-retry-token
    required: false
    type: string

  IfMatchHeader:
    description: |
      For optimistic concurrency control. In the PUT or DELETE call
      for a resource, set the `if-match` parameter to the value of the
      etag from a previous GET or POST response for that resource.
      The resource will be updated or deleted only if the etag you
      provide matches the resource's current etag value.
    in: header
    name: if-match
    required: false
    type: string

