# This is the LvvService API spec in YAML based on API Consistency Guidelines.
# Clients and documentation will be auto-generated from this file.
#
# API Consistency Guidelines: https://confluence.oci.oraclecorp.com/x/n5Sf
# Review the API checklist: https://confluence.oci.oraclecorp.com/x/dAZY

swagger: '2.0'
x-oracle-package: com.oracle.pic.networking.lvv.service
x-obmcs-splat:
  version: '1.0'
  services:
    lvvportal:
      # This enables Audit automation through SPLAT. SPLAT automatically emits following:
      #  a) an event corresponding to sync api call.
      #  b) a begin event for async api calls. Service team has to emit end events corresponding to success/failure of async call.
      #  Reference-app emits end events in respective workflow. See AuditEventEmitter for details.
      #
      # Omitting audit implies you don't want Splat to audit operations for this service (ocdn-control-plane-api)
      #
      # More details about audit automation can be found at https://confluence.oci.oraclecorp.com/x/vg5jCg and https://confluence.oci.oraclecorp.com/x/UQ9jCg
      audit:
        # defaultMode can be either none/verification/automated.
        # verification: can be used for verification. Random percentage(< 1%) of requests will be audited by Splat
        # automated: means Splat will perform audit and add "oci-splat-audited" header to requests proxied downstream
        defaultMode: automated
        eventSource: lvvportal
        requestParameterRules: [ { resources: ".*", actions: ".*", values: ".*" } ]
        requestHeaderRules:    [ { resources: ".*", actions: ".*", values: ".*" } ]
        responseHeaderRules:   [ { resources: ".*", actions: ".*", values: ".*" } ]
      # allows unreviewed entity types in splat
      # Entity types are already onboarded to identity.
      # But splat-swagger-maven-plugin version which includes them is not yet released.
      # This flag need to be removed when splat-swagger-maven-plugin update is available.
      allowingUnreviewedEntityType: true
    lvvportal-dev:
      prototype: lvvportal
      skipServiceOverridesValidation: true
      serviceOverrides:
        lvvportal: lvvportal-dev

info:
  title: LvvService API
  description: A description of the LvvService API.
  contact:
    name: "Network Control Plane"
    email: opc_nw_automation_dev_us_grp@oracle.com
    url: https://confluence.oci.oraclecorp.com/display/NETAUTO/Low+Voltage+Vendor+Portal+Security+Design+and+Considerations
  version: "1.0.0"

# array of all schemes that your API supports
schemes:
  - http
  - https
# basePath will be prefixed to all paths. Make sure to update the path in resource files and audit config in api base.conf after modifying the basePath.
basePath: /lvv
produces:
  - application/json

host: localhost:21000
# Enable SDK Retries by default
# Details: https://confluence.oci.oraclecorp.com/display/DEX/API+Consistency+Guidelines#APIConsistencyGuidelines-DefaultRetriesintheSDKs
x-obmcs-client-retries-enabled: true

x-obmcs-endpoint-template: 'https://lvv-service.{region}.oci.{secondLevelDomain}'

# =============================================================================
# Anchors used to reference common headers, properties, ...etc...
# =============================================================================
x-anchors:
  # This is being included in the 'x-anchors:' section.
  # For that reason, it is important that x-headers and x-properties are indented
  # exactly two spaces.

  # =============================================================================
  # Anchors used to reference common headers, properties, ...etc...
  # =============================================================================
  x-headers:
    opc-request-id: &ref-opc-request-id
      description: |
        Unique Oracle-assigned identifier for the request. If you need to contact
        Oracle about a particular request, please provide the request ID.
      type: string


# =============================================================================
# Paths
# =============================================================================
paths:

  /projects:
    get:
      tags: ['projects']
      x-obmcs-splat:
        authorization:
          mode: none  # TODO: tiwatso this might need to be automated
        operationType: LIST
        apiType: Synchronous
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
        allowAllRequestHeaders: true

        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: [ 'lvvportal' ]

      operationId: GetProjectList
      summary: Get Project List
      description: Gets a list of projects by specific vendors
      parameters:
        - $ref: '#/parameters/VendorQueryParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        200:
          description: Get list of projects for a specific vendor
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            type: array
            items:
              $ref: '#/definitions/Project'
        404:
          description: The vendorName could not be found
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/Error'
        default:
          $ref: '#/responses/Error'

  /projects/{projectId}:
    get:
      tags: ['projects']
      x-obmcs-splat:
        authorization:
          mode: none  # TODO: tiwatso this might need to be automated
        operationType: GET
        apiType: Synchronous
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
        allowAllRequestHeaders: true

        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: [ 'lvvportal' ]

      operationId: GetProject
      summary: Get Project
      description: Gets a project by identifier
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        200:
          description: Retrieves the project with the given id
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/Project'
        404:
          description: The project with the given projectId could not be found
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/Error'
        default:
          $ref: '#/responses/Error'

    put:
      tags: ['projects']
      x-obmcs-splat:
        authorization:
          mode: none  # TODO: tiwatso this might need to be automated
        operationType: OTHER_MUTATION
        apiType: Synchronous
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
        allowAllRequestHeaders: true

        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: [ 'lvvportal' ]

      operationId: CreateProject
      summary: Creates a new project
      description: Create a new project with the provided identifier
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/PutProjectRequestBodyParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        200:
          description: Newly created project
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/Project'
        400:
          description: The project Id is not valid
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/Error'
        default:
          $ref: '#/responses/Error'

    delete:
      tags: ['projects']
      x-obmcs-splat:
        authorization:
          mode: none  # TODO: tiwatso this might need to be automated
        operationType: OTHER_MUTATION
        apiType: Synchronous
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
        allowAllRequestHeaders: true

        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: [ 'lvvportal' ]

      operationId: DeleteProject
      description: Deletes an existing project
      parameters:
        - $ref: '#/parameters/ProjectIdentifierPathParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        204:
          description: The project was successfully deleted.
          headers:
            opc-request-id: *ref-opc-request-id
        default:
          $ref: '#/responses/Error'

  /cablingTasks:
    get:
      tags: [ 'cablingTasks' ]
      x-obmcs-splat:
        authorization:
          mode: none  # TODO: tiwatso this might need to be automated
        operationType: LIST
        apiType: Synchronous
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
        allowAllRequestHeaders: true

        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: [ 'lvvportal' ]

      operationId: GetCablingTasks
      summary: Get cabling tasks
      description: Get cabling tasks based on query parameters
      parameters:
        - $ref: '#/parameters/BuildingParam'
        - $ref: '#/parameters/BlockParam'
        - $ref: '#/parameters/RackSerialNumberParam'
        - $ref: '#/parameters/OpcRequestId'
      responses:
        200:
          description: Retrieves the cabling tasks with the given query parameters
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/CablingTaskCollection'
        default:
          $ref: '#/responses/Error'

  /cablingTasks/{cablingTaskId}/actions/getCableValidationFailureTask:
    get:
      tags: [ 'cablingTasks' ]
      x-obmcs-splat:
        authorization:
          mode: none  # TODO: tiwatso this might need to be automated
        operationType: LIST
        apiType: Synchronous
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
        allowAllRequestHeaders: true

        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: [ 'lvvportal' ]

      operationId: GetCableValidationFailureTask
      summary: Get cabling tasks
      description: Get details of cabling task based on cablingTaskId
      parameters:
        - $ref: '#/parameters/CablingTaskIdentifierPathParam'
      responses:
        200:
          description: Retrieves the detailed JSON object for a cabling task with the given query parameters 'cablingTaskId'
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/CableValidationFailureTasks'
        default:
          $ref: '#/responses/Error'

  /cablingTasks/{cablingTaskId}/actions/resolveValidationFailureTask:
    post:
      tags: [ 'cablingTasks' ]
      x-obmcs-splat:
        authorization:
          mode: none  # TODO: tiwatso this might need to be automated
        operationType: OTHER_MUTATION
        apiType: Synchronous
        # Maximum number of invocation attempts that should be made to the downstream service.
        # Any non-5xx response ends the attempts.
        maximumAttemptCount: 3
        allowAllRequestHeaders: true

        # specify the routing strategy
        # strategy: route-to-any-ad OR route-to-inferred-ad
        # route-to-any-ad: Splat will route to any AD, appropriate for regional services
        # route-to-inferred-ad: Splat supports routing based on request (body, path, query params)
        # E.g. how to infer AD from the request body https://bitbucket.oci.oraclecorp.com/projects/CIM/repos/instance-agent-service/browse/instance-agent-service-spec/specs/service-api.yaml#63
        routing:
          strategy: route-to-any-ad
        serviceList: [ 'lvvportal' ]

      operationId: ResolveValidationFailureTask
      summary: Resolve a cable validation failure task
      description: Resolve a cable validation failure task
      parameters:
        - $ref: '#/parameters/CablingTaskIdentifierPathParam'
      responses:
        200:
          description: The cabling task has been resolved.
          headers:
            opc-request-id: *ref-opc-request-id
          schema:
            $ref: '#/definitions/ResolveValidationFailureTaskResponse'
        default:
          $ref: '#/responses/Error'

#==========[ Definitions ]================================================================================================

definitions:
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      fields:
        type: string
  Project:
    description: A project object represents the information of a specific project.
    type: object
    required:
      - projectId
      - vendorName
      - building
      - block
      - type
    properties:
      projectId:
        type: string
        description: Unique Identifier of a project
        minLength: 1
        maxLength: 50
      vendorName:
        type: string
        description: Name of the vendor the project is assigned to
        minLength: 1
        maxLength: 100
      building:
        type: string
        description: building number
        minLength: 1
        maxLength: 50
      block:
        type: string
        description: block number
        minLength: 1
        maxLength: 50
      type:
        type: string
        description: Project type
        minLength: 1
        maxLength: 50
  PutProjectRequest:
    description: A request to create a new project
    properties:
      project:
        $ref: '#/definitions/Project'
  CablingTaskCollection:
    description: An array of cabling tasks.
    type: object
    properties:
      initialCablingTasks:
        description: An array of initial cabling tasks.
        type: array
        items:
          $ref: '#/definitions/InitialCablingTaskDetails'
      validationFailureTasks:
        description: An array of cable validation failure tasks.
        type: array
        items:
          $ref: '#/definitions/ValidationFailureTaskDetails'
  InitialCablingTaskDetails:
    description: Details for each initial cabling task.
    type: object
    properties:
      ticketId:
        type: string
        description: Jira-SD ticket ID corresponding to the task.
      building:
        type: string
        description: Building ID.
      block:
        type: string
        description: Block ID.
      rackLocation:
        type: string
        description: Rack location.
      rackSerialNumber:
        type: string
        description: Rack serial number.
  ValidationFailureTaskDetails:
    description: Details for each cable validation failure task.
    type: object
    properties:
      ticketId:
        type: string
        description: Jira-SD ticket ID corresponding to the task.
      building:
        type: string
        description: Building ID.
      block:
        type: string
        description: Block ID.
      rackLocation:
        type: string
        description: Rack location.
      rackSerialNumber:
        type: string
        description: Rack serial number.
      failureReason:
        type: string
        description: JSON of why cable validation fails.
  CableValidationFailureTasks:
    description: Details of CableValidationFailureTasks.
    type: object
    properties:
      lldpFailures:
        description: An array of lldp failures.
        type: array
        items:
          $ref: '#/definitions/LldpFailure'
      opticsFailures:
        description: An array of optic Failures.
        type: array
        items:
          $ref: '#/definitions/OpticsFailure'
      gpuLldpFailures:
        description: An array of gpu lldp failures.
        type: array
        items:
          $ref: '#/definitions/GpuLldpFailure'
      deviceUnreachableFailures:
        description: Show Devices that are unreachable Failures.
        type: string
      invalidTransceiverFailures:
        description: An array of invalid transceiver Failures.
        type: array
        items:
          $ref: '#/definitions/InvalidTransceiverFailure'
  LldpFailure:
    description: Details for each lldp failure.
    type: object
    properties:
      currentOrigin:
        type: string
        description: current origin.
      currentDestination:
        type: string
        description: current destination.
      expectedDestination:
        type: string
        description: expected destination.
  GpuLldpFailure:
    description: Details for each gpu lldp failure.
    type: object
    properties:
      currentOrigin:
        type: string
        description: current origin.
      currentDestination:
        type: string
        description: current destination.
      expectedDestination:
        type: string
        description: expected destination.
  OpticsFailure:
    description: Details for each optic failure.
    type: object
    properties:
      device:
        type: string
        description: device.
      intfName:
        type: string
        description: intf name.
      inputPower:
        type: string
        description: input power.
      outputPower:
        type: string
        description: output power.
      devicePhys:
        type: string
        description: device phys.
  InvalidTransceiverFailure:
    description: Details for each invalid transceiver failure.
    type: object
    properties:
      errorMessage:
        type: string
        description: errorMessage.
  ResolveValidationFailureTaskResponse:
    description: ResolveValidationFailureTaskResponse.
    type: object
    properties:
      cablingTaskId:
        type: string
        description: cablingTaskId.

#==========[ Parameters ]================================================================================================
parameters:
  PutProjectRequestBodyParam:
    name: value
    in: body
    required: true
    schema:
      $ref: '#/definitions/PutProjectRequest'
    description: Information required for creating a project
  ProjectIdentifierPathParam:
    name: projectId
    type: string
    in: path
    description: Unique Id for a project
    minLength: 1
    maxLength: 50
  BuildingParam:
    name: building
    type: string
    in: query
    required: true
    description: Unique Id for a building
    minLength: 1
    maxLength: 10
  BlockParam:
    name: block
    type: string
    in: query
    required: true
    description: Unique Id for a block
    minLength: 1
    maxLength: 10
  RackSerialNumberParam:
    name: rackSerialNumber
    type: string
    in: query
    description: Serial number for a rack
  VendorQueryParam:
    name: vendorName
    type: string
    in: query
    description: Unique name for vendor
    minLength: 1
    maxLength: 50
  CablingTaskIdentifierPathParam:
    name: cablingTaskId
    type: string
    in: path
    description: A unique cabling task identifier
    required: true
  OpcRequestId:
    name: opc-request-id
    in: header
    required: false
    type: string
    description: |
      Unique Oracle-assigned identifier for the request. If you need to contact Oracle about
      a particular request, please provide the request ID.


#==========[ Responses ]================================================================================================
responses:
  Error:
    description: An unexpected error has occurred
    schema:
      $ref: '#/definitions/Error'
