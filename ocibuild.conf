# To use the OCI Build Service you place a file name ocibuild.conf at the root of your git repo.
# This file, written using the HOCON syntax, will cause a build to automatically be triggered when commits are pushed to your repo.
# The ocibuild.conf file also determines how build service executes the build commands on the source code in your repo.
#
# Build Service Reference: https://confluence.oci.oraclecorp.com/x/7kMZBg
# Where is my build: https://devops.oci.oraclecorp.com/build
# HOCON reference: https://github.com/lightbend/config/blob/master/HOCON.md
# Build Service Slack: #oci_build_svc_users

runnerTag: latest
name: lvv-service
team: Network Automation
phoneBookId: network-automation
description: Example-Service
majorversion: 0
minorversion: 1
shortversion: ${majorversion}.${minorversion}
snapshotVersion: ${shortversion}-SNAPSHOT
# BLD_NUMBER contains the build number of this build, which is automatically incremented for each successive build in each branch.
# BLD_BRANCH_SUFFIX is the branch name with a leading hyphen. For instance, if your branch name is foo, then the BLD_BRANCH_SUFFIX would be -foo.
# If your branch is master, the BLD_BRANCH_SUFFIX would be null.
# BuildService will expand ${?BLD_SNAPSHOT_SUFFIX} to -SNAPSHOT, for snapshot branches.
# Note that incase you are not setting the version using the version property,
# ensure that -SNAPSHOT suffix is present to enable publish support to snapshot repository.
version: ${shortversion}${?BLD_BRANCH_SUFFIX}.${BLD_NUMBER}${?BLD_SNAPSHOT_SUFFIX}
# A list of branch names, including special branch name 'pull-requests'.  Determines which branches will trigger on
# commit to bitbucket.
triggerOnCommitBranches: ["master", "pull-requests", "lvv-service-*"]
# A list of branch names that should run all defined build steps including those which publish artifacts.
# If a branch is not included in the list, it will be a 'dry-run' build and skips any steps that push dependencies,
# runs scanners, or notifies other services, such as pipelines.
releaseBranches: ["master"]
# For all branches specified using snapshotBranches, BuildService will expand ${?BLD_SNAPSHOT_SUFFIX} to -SNAPSHOT
# which can be used to add the -SNAPSHOT suffix to the version.
snapshotBranches: ["lvv-service-*", "pull-requests", "PR-*"]
# bitbucketTag (optional): Creates a unique tag on the commit when a build from a release branch (see releaseBranches) completes.
# In order to authorize tag creation, provide write permission to the service account build_service_role under repository settings in the bitbucket UI.
# Also as tags are unique in a repo, creating another tag with the same name is not possible in the repo.
bitbucketTag: {
  "enabled": true,
  "tagName": ${version},
  "description": "Build Service Created Tag"
}

## Build Service Slack Notification ##
# Note: Build Service Slack notifications are currently only available for channels in the Cloud-Infra-GBU workspace. Details: https://confluence.oci.oraclecorp.com/x/hRgJGw
# A list of branch names, including 'pull-requests', that you want to send Slack notification after branch build is succeeded or failed.
sendNotificationBranches:  ["master", "pull-requests"]
# A list of Slack channel names where you want to send Slack notification for branch defined in sendNotificationBranches.
# Please add the slack channels where you like get notified about the build. In addition to that, you need to install "Build Service" Slack app into the channels first.
# Please follow https://confluence.oci.oraclecorp.com/x/hRgJGw for detailed steps.
# Example - slackChannels: ["#sample_channel_name"]
slackChannels: []

## Build Service AuthZ ##
# Compartment ID which build service will use to do authorization to restrict UI access in build service.
# By default, we use compartment ID provided by Build Service which only has Read permission and
# not Update/Delete/Create permission. With read permission, you are only limited to accessing your builds in Build Service UI.
#
# TODO-REPLACE: Update/Delete/Create permissions are required for essential operations like retrying builds, canceling ongoing builds etc. Hence,
# we highly recommend onboard to build service AuthZ and replace the below compartment ID
# Onboarding Guide: https://confluence.oci.oraclecorp.com/x/h81fJw
authCompartmentOcid: ocid1.compartment.oc1..aaaaaaaalt3ghoq5nfxenlijgbauts66jr6ntlctdvkp7n34pruewyb3vi4q

## Multi-arch build support ##
# Build Service supports multi-arch build, it generates artifacts in different platforms, with a flattened MAM artifact with different platform manifests, define the desired build platforms here
# For this example, Build Service will generate an artifact for x86, an artifact for arm64, and a flattened artifact can be deployed in both platform.
# Replace "platform: "linux/arm64"" to "images: ${imagePlatform}" to apply multi-arch build support.
# imagePlatform: [
#   {
#     platform = "linux/x86_64"
#   },
#   {
#     platform = "linux/arm64"
#   }
# ]

steps:
  [
    {
      name: compilesource
      type: maven
      mavenCommands: [
        { goal: "validate", args: "-N --global-toolchains build_config/toolchains.xml -DrequireVersion="${snapshotVersion} },
        { goal: "versions:set", args: "-DnewVersion="${version}" -DprocessAllModules=true" },
        { goal: "verify", args: " --global-toolchains build_config/toolchains.xml" }
      ]
      runnerImage: build-runner-maven-graalvm22-jdk17
      javaVersion: jdk-17
      artifacts: [
        "**"
      ]
      testCoverageLocation : "**/target/jacoco-reports" #This is the directory location of the jacoco reports specified in the POM.XML. Build Service will tar all the files under this location and upload to Object Storage.
    },
    {
      # In the publishmaven step, the user can define the release and snapshot repo
      # using the attributes repository and snapshotRepository.
      # Artifacts generated with the suffix -SNAPSHOT will be published to snapshotRepository,
      # else they will publish to your repository (i.e. release repository).
      # More details can be found here - https://confluence.oci.oraclecorp.com/x/H7S-Fg
      name: publish_maven_artifacts
      type: publishmaven
      dependsOn: compilesource
      repository: lvv-service-release-maven-local
      snapshotRepository: lvv-service-snapshot-maven-local
    },
    {
      name: dockerize_api
      type: dockerizer
      dockerFile: "lvv-service-api/target/docker/Dockerfile"
      dockerBuildPwd: "lvv-service-api"
      dependsOn: compilesource
      platform: "linux/arm64"
    },
    {
      name: publish_docker_api
      type: publishdocker
      dependsOn: dockerize_api
      repository: odo-docker-signed-local
      imageName: ${name}"-api"
    },
#     {
#       name: dockerize_canary
#       type: dockerizer
#       dependsOn: compilesource
#       dockerFile: "lvv-service-canary/target/docker/Dockerfile"
#       dockerBuildPwd: "lvv-service-canary"
#       platform: "linux/arm64"
#     },
#     {
#       name: publish_docker_canary
#       type: publishdocker
#       dependsOn: dockerize_canary
#       repository: odo-docker-signed-local
#       imageName: ${name}"-canary"
#     },
    {
      name: publish_spec_maven_artifacts
      type: publishmaven
      dependsOn: compilesource
      pomLocation: lvv-service-spec
      repository: lvv-service-release-maven-local
      snapshotRepository: lvv-service-snapshot-maven-local
    },
    {
      name: publish_java_client_maven_artifacts
      type: publishmaven
      dependsOn: compilesource
      pomLocation: lvv-service-java-client
      repository: lvv-service-release-maven-local
      snapshotRepository: lvv-service-snapshot-maven-local
    },
    {
      name: publish_python_client_maven_artifacts
      type: publishmaven
      dependsOn: compilesource
      pomLocation: lvv-service-python-client
      repository: lvv-service-release-maven-local
      snapshotRepository: lvv-service-snapshot-maven-local
    }
  ]
